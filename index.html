<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>지유의 별빛 정원</title>
<meta name="theme-color" content="#160f33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="지유의 정원">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    background: linear-gradient(180deg, #0d0a26 0%, #1a1440 45%, #2d1b69 100%);
    color: #fdf6ff;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  /* ---------- 별이 반짝이는 배경 ---------- */
  #starfield { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .bg-star {
    position: absolute; border-radius: 50%;
    background: #fff;
    animation: twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: .15; transform: scale(1); }
    50% { opacity: .9; transform: scale(1.4); }
  }

  /* ---------- 화면 공통 ---------- */
  .screen {
    position: fixed; inset: 0; z-index: 1;
    display: none; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .screen.active { display: flex; }
  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px; z-index: 5;
  }
  .topbar h2 { font-size: 19px; font-weight: 700; flex: 1; text-shadow: 0 0 12px rgba(255,180,255,.5); }
  .btn {
    border: none; cursor: pointer;
    background: rgba(255,255,255,.12);
    color: #fdf6ff; font-family: inherit;
    border-radius: 999px; padding: 9px 16px;
    font-size: 15px; font-weight: 600;
    backdrop-filter: blur(6px);
    transition: transform .25s ease, background .25s ease;
  }
  .btn:active { transform: scale(.93); background: rgba(255,255,255,.22); }
  .btn.round { width: 42px; height: 42px; padding: 0; font-size: 19px; display: inline-flex; align-items: center; justify-content: center; }

  /* ---------- 홈 화면 ---------- */
  #home { align-items: center; overflow-y: auto; }
  .home-head { text-align: center; padding: 42px 20px 8px; }
  .home-head .moon { font-size: 44px; display: block; animation: floaty 5s ease-in-out infinite; }
  @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .home-head h1 {
    font-size: 30px; font-weight: 800; margin-top: 8px; letter-spacing: 1px;
    background: linear-gradient(90deg, #ffd6f2, #c9b8ff, #a8f0e8, #ffe9a8);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 8s linear infinite; background-size: 300% 100%;
  }
  @keyframes shimmer { 0% { background-position: 0% 0; } 100% { background-position: 300% 0; } }
  .home-head p { margin-top: 10px; font-size: 14px; color: #cfc3f5; line-height: 1.7; }
  .home-head p strong { color: #ffd6f2; }

  .cards {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 14px; padding: 22px 20px; width: 100%; max-width: 460px;
  }
  .card {
    border: none; cursor: pointer; font-family: inherit; color: #fff;
    border-radius: 24px; padding: 20px 12px 18px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.25);
    transition: transform .25s ease;
  }
  .card:active { transform: scale(.95); }
  .card .ico { font-size: 38px; display: block; }
  .card .nm { display: block; margin-top: 10px; font-size: 16px; font-weight: 700; }
  .card .ds { display: block; margin-top: 5px; font-size: 12px; opacity: .85; line-height: 1.5; }
  .card.c1 { background: linear-gradient(135deg, #ff8fc7, #b06ee8); }
  .card.c2 { background: linear-gradient(135deg, #6ec3f0, #7a6ee8); }
  .card.c3 { background: linear-gradient(135deg, #57ceaa, #3f8fd8); }
  .card.c4 { background: linear-gradient(135deg, #f5a860, #e8608a); }
  .card.c5 { background: linear-gradient(135deg, #c9b8ff, #8a6ee8); grid-column: 1 / -1; }

  .home-foot { padding: 4px 24px 36px; text-align: center; font-size: 12.5px; color: #a99ae0; line-height: 1.8; }

  /* ---------- 첫 선물 오버레이 ---------- */
  #gift {
    position: fixed; inset: 0; z-index: 50;
    background: linear-gradient(180deg, #0d0a26, #241454);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 32px;
  }
  #gift.active { display: flex; }
  #gift .big { font-size: 70px; animation: floaty 4s ease-in-out infinite; }
  #gift h1 { font-size: 26px; margin-top: 18px; color: #ffd6f2; }
  #gift p { margin-top: 16px; font-size: 15.5px; line-height: 2; color: #e8ddff; max-width: 320px; }
  #gift .btn { margin-top: 30px; font-size: 17px; padding: 14px 34px; background: linear-gradient(135deg, #ff8fc7, #b06ee8); box-shadow: 0 6px 20px rgba(255,143,199,.4); }

  /* ---------- 그림판 ---------- */
  #draw .stage, #bubbles .stage { position: relative; flex: 1; }
  canvas.full { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  .toolrow { display: flex; gap: 8px; justify-content: center; padding: 10px 12px 18px; flex-wrap: wrap; }

  /* ---------- 숨결 별 ---------- */
  #breath .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; }
  #breathCircle {
    width: 150px; height: 150px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffe9a8, #ff8fc7 55%, #b06ee8);
    box-shadow: 0 0 60px 12px rgba(255,143,199,.45);
    display: flex; align-items: center; justify-content: center;
    font-size: 44px;
    transform: scale(.75);
  }
  #breathText { font-size: 21px; font-weight: 700; color: #ffe9d6; min-height: 30px; text-shadow: 0 0 14px rgba(255,200,150,.5); }
  #breathStars { min-height: 34px; font-size: 24px; letter-spacing: 6px; }
  #breathStars span { display: inline-block; animation: bloomIn .9s ease both; }
  @keyframes bloomIn { from { transform: scale(0) rotate(-90deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }

  /* ---------- 정원 ---------- */
  #garden .stage {
    position: relative; flex: 1; overflow: hidden;
    background: linear-gradient(180deg, transparent 55%, rgba(46,84,58,.55) 78%, rgba(38,74,50,.8) 100%);
    touch-action: none;
  }
  .flower {
    position: absolute; transform: translate(-50%, -80%);
    font-size: 34px; animation: grow .9s cubic-bezier(.2,1.4,.4,1) both;
    filter: drop-shadow(0 0 6px rgba(255,255,255,.25));
  }
  @keyframes grow { from { transform: translate(-50%,-80%) scale(0); } to { transform: translate(-50%,-80%) scale(1); } }
  .flower.watered { animation: sway 1.6s ease-in-out 2; }
  @keyframes sway { 0%,100% { transform: translate(-50%,-80%) rotate(0); } 25% { transform: translate(-50%,-80%) rotate(-10deg); } 75% { transform: translate(-50%,-80%) rotate(10deg); } }
  #butterfly { position: absolute; font-size: 26px; transition: transform .2s linear; pointer-events: none; z-index: 3; }
  .garden-hint { position: absolute; top: 12px; left: 0; right: 0; text-align: center; font-size: 13.5px; color: #d6f5e0; text-shadow: 0 1px 4px rgba(0,0,0,.5); pointer-events: none; }

  /* ---------- 우체통 ---------- */
  #mail .stage { flex: 1; overflow-y: auto; padding: 8px 22px 30px; display: flex; flex-direction: column; align-items: center; }
  .letter {
    width: 100%; max-width: 420px;
    background: linear-gradient(160deg, #fff8ee, #ffeef8);
    color: #4a3557; border-radius: 22px;
    padding: 26px 24px; margin-top: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    animation: letterIn .7s cubic-bezier(.2,1.2,.4,1) both;
  }
  @keyframes letterIn { from { transform: translateY(24px) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
  .letter .stamp { font-size: 30px; }
  .letter h3 { margin-top: 10px; font-size: 17px; color: #b0508a; }
  .letter p { margin-top: 14px; font-size: 15.5px; line-height: 2.05; white-space: pre-line; }
  .letter .from { margin-top: 18px; text-align: right; font-size: 14px; color: #8a6aa0; font-weight: 700; }
  .mail-nav { display: flex; gap: 10px; margin-top: 18px; }
  .mail-note { margin-top: 16px; font-size: 12.5px; color: #b8a8e8; text-align: center; line-height: 1.8; }

  /* 팝 파티클(공용) */
  .spark {
    position: fixed; pointer-events: none; z-index: 40; font-size: 18px;
    animation: sparkFly 1s ease-out forwards;
  }
  @keyframes sparkFly {
    from { transform: translate(0,0) scale(1); opacity: 1; }
    to { transform: translate(var(--dx), var(--dy)) scale(.3); opacity: 0; }
  }
</style>
</head>
<body>

<div id="starfield"></div>

<!-- 첫 실행 선물 오버레이 -->
<div id="gift">
  <div class="big">🎁</div>
  <h1>지유에게 도착한 선물</h1>
  <p id="giftMsg"></p>
  <button class="btn" id="giftOpen">선물 열기 ✨</button>
</div>

<!-- 홈 -->
<main id="home" class="screen active">
  <div class="home-head">
    <span class="moon">🌙</span>
    <h1 id="appTitle"></h1>
    <p id="appDedication"></p>
  </div>
  <div class="cards">
    <button class="card c1" data-go="draw"><span class="ico">🎨</span><span class="nm">반짝 그림판</span><span class="ds">손끝에서 빛이<br>피어나요</span></button>
    <button class="card c2" data-go="bubbles"><span class="ico">🫧</span><span class="nm">마음 방울</span><span class="ds">신나는 말을 담은<br>방울을 톡톡!</span></button>
    <button class="card c3" data-go="breath"><span class="ico">🌬️</span><span class="nm">숨결 별</span><span class="ds">별과 함께<br>천천히 숨쉬어요</span></button>
    <button class="card c4" data-go="garden"><span class="ico">🌷</span><span class="nm">지유의 정원</span><span class="ds">매일 자라나는<br>나만의 꽃밭</span></button>
    <button class="card c5" data-go="mail"><span class="ico">💌</span><span class="nm">별빛 우체통</span><span class="ds">매일 한 통씩, 지유에게 온 편지</span></button>
  </div>
  <div class="home-foot">
    <button class="btn" id="soundToggle">🔔 소리 켜짐</button>
    <p style="margin-top:14px" id="footNote"></p>
  </div>
</main>

<!-- 반짝 그림판 -->
<section id="draw" class="screen">
  <div class="topbar">
    <button class="btn round" data-go="home">←</button>
    <h2>🎨 반짝 그림판</h2>
    <button class="btn" id="symBtn">🪞 대칭 6</button>
  </div>
  <div class="stage">
    <canvas id="paint" class="full"></canvas>
    <canvas id="paintFx" class="full" style="pointer-events:none"></canvas>
  </div>
  <div class="toolrow">
    <button class="btn" id="clearPaint">🌫️ 스르륵 지우기</button>
    <button class="btn" id="savePaint">📸 작품 저장</button>
  </div>
</section>

<!-- 마음 방울 -->
<section id="bubbles" class="screen">
  <div class="topbar">
    <button class="btn round" data-go="home">←</button>
    <h2>🫧 마음 방울</h2>
  </div>
  <div class="stage">
    <canvas id="bubbleCv" class="full"></canvas>
  </div>
</section>

<!-- 숨결 별 -->
<section id="breath" class="screen">
  <div class="topbar">
    <button class="btn round" data-go="home">←</button>
    <h2>🌬️ 숨결 별</h2>
  </div>
  <div class="stage">
    <div id="breathText">준비되면 시작을 눌러요</div>
    <div id="breathCircle">⭐</div>
    <div id="breathStars"></div>
    <button class="btn" id="breathBtn" style="font-size:16px; padding:12px 28px">시작하기</button>
  </div>
</section>

<!-- 지유의 정원 -->
<section id="garden" class="screen">
  <div class="topbar">
    <button class="btn round" data-go="home">←</button>
    <h2>🌷 지유의 정원</h2>
    <button class="btn" id="waterBtn">💧 물 주기</button>
  </div>
  <div class="stage" id="gardenStage">
    <div class="garden-hint" id="gardenHint"></div>
    <div id="butterfly">🦋</div>
  </div>
</section>

<!-- 별빛 우체통 -->
<section id="mail" class="screen">
  <div class="topbar">
    <button class="btn round" data-go="home">←</button>
    <h2>💌 별빛 우체통</h2>
  </div>
  <div class="stage">
    <div class="letter" id="letterCard"></div>
    <div class="mail-nav">
      <button class="btn" id="prevLetter">← 지난 편지</button>
      <button class="btn" id="nextLetter">다음 편지 →</button>
    </div>
    <p class="mail-note">편지는 매일 한 통씩 새로 도착해요.<br>인터넷이 없어도, 어느 나라에 있어도 열 수 있어요. 🌏</p>
  </div>
</section>

<script>
/* ==========================================================
   ✏️ 여기만 고치면 나만의 선물이 됩니다
   ========================================================== */
const CONFIG = {
  childName: "지유",           // 아이 이름
  fullName: "홍지유",          // 아이 전체 이름
  sender: "지유의 영원한 단짝, 고모부 이상국",  // 편지 끝에 적히는 이름
  dedication: "이 앱은 세상에 딱 하나뿐이에요.\n오직 <strong>홍지유</strong>, 너를 위해서만 만들어졌어요.",
  giftMessage: "지유야, 안녕! 고모부다! 😎\n너를 생각하면서 아주 오래오래 만든 선물이야.\n이 안의 별과 꽃과 편지는 전부\n세상에서 딱 한 사람, 홍지유의 것!",
  // 💌 편지들 — 자유롭게 고치고, 추가하세요. 매일 순서대로 한 통씩 도착합니다.
  letters: [
    { title: "첫 번째 편지", body: "지유야! 고모부다! 😎\n\n이 앱은 어디서도 못 사고, 누구도 못 가져. 세상에 딱 하나, 홍지유 전용이거든. 고모부가 지유 생각하면서 한 땀 한 땀 만들었지. 어때, 고모부 좀 멋진 듯?\n\n구석구석 눌러 보면서 신나게 놀아 봐!" },
    { title: "고모부의 1급 기밀", body: "지유한테만 알려주는 고모부의 1급 기밀! 🤫\n\n고모부는 사실... 지유랑 노는 날이 일 년 중에 제일 신난다. 다른 어른들한테는 비밀이야.\n\n이 기밀을 아는 사람은 지구에서 홍지유 딱 한 명뿐! 쉿!" },
    { title: "오늘의 신나는 미션", body: "오늘의 미션 나갑니다! 🎨\n\n반짝 그림판에 고모부 얼굴 그리기! 단, 조건이 하나 있다. 실제보다 열 배 잘생기게 그릴 것!\n\n다 그리면 '작품 저장' 눌러서 모아 놨다가 나중에 고모부한테 보여줘. 완전 기대 중!" },
    { title: "고모부 해바라기", body: "지유의 정원에 고모부 꽃을 심어 줘! 🌻\n\n제일 크고 노란 해바라기가 나올 때까지 심는 거야. 그게 바로 고모부다! 지유 정원 한가운데서 제일 해맑게 웃고 있을게.\n\n물 주기 버튼 누르면 고모부가 신나서 춤출걸?" },
    { title: "달나라 접선 작전", body: "오늘 밤에 달 한번 봐 봐. 🌙\n\n한국에서 고모부도 똑같은 달을 보면서 손을 흔들고 있을 거야. 달은 지구에 딱 하나라서, 우리는 매일 밤 같은 달에서 만나는 거지.\n\n달 볼 때마다 \"고모부다!\" 하고 인사해 줘. 고모부한테 다 들린다?" },
    { title: "마법의 주문", body: "따라 해 봐. \"나는 홍지유다. 나는 반짝인다!\"\n\n세 번 외치면 진짜로 반짝여져. 고모부가 이 앱에 마법을 걸어놨거든. ✨\n\n못 믿겠으면 거울 앞에서 해 봐. 반짝반짝한 애가 한 명 서 있을걸?" },
    { title: "고모부의 자랑", body: "누가 고모부한테 \"세상에서 제일 자랑하고 싶은 게 뭐예요?\" 하고 물으면, 고모부는 일 초도 고민 안 해.\n\n\"우리 지유요!\" 😎\n\n그러니까 지유도 어디 가서 당당하게 말해. \"우리 고모부가 나만을 위한 앱을 만들어 줬다!\"" },
    { title: "간식 대탐험", body: "새로운 나라에 가면 지유가 할 일이 있다! 바로 '세상에서 제일 맛있는 간식 찾기 대탐험' 🍭\n\n최고로 맛있는 걸 발견하면 이름을 꼭 기억해 놔. 나중에 고모부 만나면 알려 줘야 해. 고모부도 사 먹게!\n\n탐험대장 홍지유, 출동!" },
    { title: "히죽히죽 사건", body: "고모부는 오늘도 지유 사진 보다가 히죽히죽 웃어서 고모한테 들켰다. 😆\n\n고모가 \"왜 웃어?\" 그러길래 \"우리 지유가 최고라서\"라고 했지. 그랬더니 고모도 같이 히죽히죽.\n\n지유는 사진만으로 두 사람을 웃게 만드는 능력자인 거야!" },
    { title: "방울 연주회", body: "마음 방울 터뜨릴 때 나는 '톡' 소리 있지? 그거 고모부가 고르고 골라서 넣은 소리다?\n\n어떤 순서로 터뜨려도 노래가 되게 만들었지. 딩동댕~ 🎵\n\n방울 백 개 터뜨리면 지유만의 연주회 완성! 제목은 '홍지유 방울 교향곡'으로 하자." },
    { title: "내일 또 만나", body: "이 편지들은 하루에 딱 한 통씩만 도착해. 왜냐고?\n\n고모부가 매일매일 지유한테 인사하고 싶어서! 😆\n\n그러니까 내일 또 우체통 열어 봐. 안 오면 고모부 편지가 삐질 수도 있다?" },
    { title: "마지막 편지... 일까?", body: "벌써 마지막 편지네! 하지만 걱정 마시라~ 🌈\n\n편지는 언제든 처음부터 다시 읽을 수 있고, 정원의 꽃도 그림판의 마법도 전부 그대로야. 그리고 우리는 또 만날 거니까!\n\n그때까지 이 정원 반짝반짝하게 가꿔 놓기. 고모부랑 약속! 🤙" },
  ],
};

const $ = (s) => document.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem("jiyu_" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("jiyu_" + k, JSON.stringify(v)); } catch {} },
};

/* ---------- 문구 채우기 ---------- */
$("#appTitle").textContent = CONFIG.childName + "의 별빛 정원";
$("#appDedication").innerHTML = CONFIG.dedication.replace(/\n/g, "<br>");
$("#giftMsg").textContent = CONFIG.giftMessage;
$("#footNote").textContent = "점수도 시간제한도 없는, " + CONFIG.childName + " 마음대로 반짝반짝 노는 곳! 🎉";

/* ---------- 배경 별 ---------- */
(function makeStars() {
  const field = $("#starfield");
  for (let i = 0; i < 60; i++) {
    const s = document.createElement("div");
    s.className = "bg-star";
    const size = 1 + Math.random() * 2.5;
    s.style.cssText = `width:${size}px;height:${size}px;left:${Math.random() * 100}%;top:${Math.random() * 100}%;animation-delay:${Math.random() * 4}s;animation-duration:${3 + Math.random() * 4}s`;
    field.appendChild(s);
  }
})();

/* ---------- 부드러운 소리 (외부 파일 없이) ---------- */
let audioCtx = null;
let soundOn = store.get("sound", true);
function updateSoundBtn() { $("#soundToggle").textContent = soundOn ? "🔔 소리 켜짐" : "🔕 소리 꺼짐"; }
updateSoundBtn();
$("#soundToggle").addEventListener("click", () => { soundOn = !soundOn; store.set("sound", soundOn); updateSoundBtn(); chime(660); });
function chime(freq = 523, dur = 0.5, type = "sine", vol = 0.12) {
  if (!soundOn) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch {}
}
const PENTA = [523.25, 587.33, 659.25, 783.99, 880.0]; // 어떤 순서로 울려도 어울리는 5음계
const softNote = () => chime(PENTA[Math.floor(Math.random() * PENTA.length)], 0.6);

/* ---------- 반짝 파티클 (DOM) ---------- */
function sparkBurst(x, y, n = 6) {
  const glyphs = ["✨", "⭐", "💫", "🌟"];
  for (let i = 0; i < n; i++) {
    const el = document.createElement("div");
    el.className = "spark";
    el.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
    const ang = Math.random() * Math.PI * 2, dist = 40 + Math.random() * 60;
    el.style.left = x + "px"; el.style.top = y + "px";
    el.style.setProperty("--dx", Math.cos(ang) * dist + "px");
    el.style.setProperty("--dy", Math.sin(ang) * dist - 20 + "px");
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1000);
  }
}

/* ---------- 화면 전환 ---------- */
let current = "home";
const enterHooks = {}, leaveHooks = {};
function go(id) {
  if (leaveHooks[current]) leaveHooks[current]();
  document.querySelectorAll(".screen").forEach((s) => s.classList.remove("active"));
  $("#" + id).classList.add("active");
  current = id;
  if (enterHooks[id]) enterHooks[id]();
}
document.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => { softNote(); go(b.dataset.go); }));

/* ---------- 첫 실행: 선물 열기 ---------- */
if (!store.get("opened", false)) $("#gift").classList.add("active");
$("#giftOpen").addEventListener("click", (e) => {
  store.set("opened", true);
  $("#gift").classList.remove("active");
  sparkBurst(e.clientX || innerWidth / 2, e.clientY || innerHeight / 2, 14);
  chime(659, 0.8); setTimeout(() => chime(784, 0.8), 180); setTimeout(() => chime(1047, 1.1), 380);
});

/* ---------- 캔버스 리사이즈 공통 ---------- */
function fitCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
  if (cv.width !== Math.round(r.width * dpr)) { cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); }
  return { w: r.width, h: r.height, dpr };
}

/* ==========================================================
   🎨 반짝 그림판 — 만다라 대칭 + 빛나는 선
   ========================================================== */
(function drawPad() {
  const paint = $("#paint"), fx = $("#paintFx");
  const pctx = paint.getContext("2d"), fctx = fx.getContext("2d");
  let sym = 6, hue = 300, drawing = false, last = null, raf = null;
  const sparks = [];
  const symModes = [6, 8, 12, 1];

  $("#symBtn").addEventListener("click", () => {
    sym = symModes[(symModes.indexOf(sym) + 1) % symModes.length];
    $("#symBtn").textContent = sym === 1 ? "🪞 자유" : "🪞 대칭 " + sym;
    softNote();
  });

  function pos(e) {
    const r = paint.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  }

  function strokeSeg(a, b) {
    const { w, h, dpr } = fitCanvas(paint);
    const cx = w / 2, cy = h / 2;
    pctx.save(); pctx.scale(dpr, dpr);
    pctx.lineCap = "round"; pctx.lineWidth = 5;
    pctx.shadowBlur = 14;
    for (let i = 0; i < sym; i++) {
      const ang = (i * Math.PI * 2) / sym;
      const col = `hsl(${(hue + i * 12) % 360}, 95%, 72%)`;
      pctx.strokeStyle = col; pctx.shadowColor = col;
      for (const flip of sym === 1 ? [1] : [1, -1]) {
        const p1 = rot(a, cx, cy, ang, flip), p2 = rot(b, cx, cy, ang, flip);
        pctx.beginPath(); pctx.moveTo(p1.x, p1.y); pctx.lineTo(p2.x, p2.y); pctx.stroke();
        if (Math.random() < 0.25) sparks.push({ x: p2.x, y: p2.y, life: 1, vx: (Math.random() - 0.5) * 0.8, vy: -0.4 - Math.random() * 0.6, hue });
      }
    }
    pctx.restore();
    hue = (hue + 1.5) % 360;
  }
  function rot(p, cx, cy, ang, flip) {
    let dx = p.x - cx, dy = (p.y - cy) * flip;
    return { x: cx + dx * Math.cos(ang) - dy * Math.sin(ang), y: cy + dx * Math.sin(ang) + dy * Math.cos(ang) };
  }

  function fxLoop() {
    const { w, h, dpr } = fitCanvas(fx);
    fctx.save(); fctx.scale(dpr, dpr); fctx.clearRect(0, 0, w, h);
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x += s.vx; s.y += s.vy; s.life -= 0.02;
      if (s.life <= 0) { sparks.splice(i, 1); continue; }
      fctx.globalAlpha = s.life;
      fctx.fillStyle = `hsl(${s.hue}, 100%, 85%)`;
      fctx.beginPath(); fctx.arc(s.x, s.y, 1.6 + s.life * 1.6, 0, Math.PI * 2); fctx.fill();
    }
    fctx.restore();
    raf = requestAnimationFrame(fxLoop);
  }

  paint.addEventListener("pointerdown", (e) => { drawing = true; last = pos(e); strokeSeg(last, last); if (Math.random() < 0.4) softNote(); });
  paint.addEventListener("pointermove", (e) => { if (!drawing) return; const p = pos(e); strokeSeg(last, p); last = p; });
  addEventListener("pointerup", () => { drawing = false; });

  $("#clearPaint").addEventListener("click", () => {
    chime(392, 0.9);
    let step = 0;
    const t = setInterval(() => {
      const { w, h, dpr } = fitCanvas(paint);
      pctx.save(); pctx.scale(dpr, dpr);
      pctx.fillStyle = "rgba(20, 14, 50, 0.25)"; pctx.fillRect(0, 0, w, h);
      pctx.restore();
      if (++step > 14) { clearInterval(t); pctx.clearRect(0, 0, paint.width, paint.height); }
    }, 60);
  });

  $("#savePaint").addEventListener("click", () => {
    const out = document.createElement("canvas");
    out.width = paint.width; out.height = paint.height;
    const octx = out.getContext("2d");
    const g = octx.createLinearGradient(0, 0, 0, out.height);
    g.addColorStop(0, "#0d0a26"); g.addColorStop(1, "#2d1b69");
    octx.fillStyle = g; octx.fillRect(0, 0, out.width, out.height);
    octx.drawImage(paint, 0, 0);
    const a = document.createElement("a");
    a.download = CONFIG.fullName + "의 작품.png";
    a.href = out.toDataURL("image/png");
    a.click();
    chime(880, 0.7); sparkBurst(innerWidth / 2, innerHeight - 80, 10);
  });

  enterHooks.draw = () => { fitCanvas(paint); fitCanvas(fx); raf = requestAnimationFrame(fxLoop); };
  leaveHooks.draw = () => cancelAnimationFrame(raf);
})();

/* ==========================================================
   🫧 마음 방울 — 응원 단어를 담고 떠오르는 방울
   ========================================================== */
(function bubblePlay() {
  const cv = $("#bubbleCv"), ctx = cv.getContext("2d");
  const WORDS = [CONFIG.childName + " 최고", "야호!", "반짝반짝", "신난다!", "랄랄라~", "히히", "팡!", CONFIG.childName + " 만세", "고모부 최고", "딩동댕~"];
  let bubbles = [], raf = null;

  function spawn(w, h, initial) {
    const r = 34 + Math.random() * 26;
    bubbles.push({
      x: r + Math.random() * (w - r * 2),
      y: initial ? Math.random() * h : h + r + Math.random() * h * 0.3,
      r, vy: 0.25 + Math.random() * 0.4, wob: Math.random() * Math.PI * 2,
      hue: Math.floor(Math.random() * 360), word: WORDS[Math.floor(Math.random() * WORDS.length)],
    });
  }

  function loop() {
    const { w, h, dpr } = fitCanvas(cv);
    ctx.save(); ctx.scale(dpr, dpr); ctx.clearRect(0, 0, w, h);
    while (bubbles.length < 7) spawn(w, h);
    for (const b of bubbles) {
      b.y -= b.vy; b.wob += 0.02;
      const x = b.x + Math.sin(b.wob) * 10;
      if (b.y < -b.r) { b.y = h + b.r; b.x = b.r + Math.random() * (w - b.r * 2); }
      const g = ctx.createRadialGradient(x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.1, x, b.y, b.r);
      g.addColorStop(0, `hsla(${b.hue}, 90%, 88%, .95)`);
      g.addColorStop(0.75, `hsla(${b.hue}, 85%, 70%, .45)`);
      g.addColorStop(1, `hsla(${b.hue}, 85%, 65%, .15)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = `hsla(${b.hue}, 90%, 85%, .6)`; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.95)";
      ctx.font = `600 ${Math.max(12, b.r * 0.34)}px sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(b.word, x, b.y);
      b.drawX = x;
    }
    ctx.restore();
    raf = requestAnimationFrame(loop);
  }

  cv.addEventListener("pointerdown", (e) => {
    const r = cv.getBoundingClientRect();
    const px = e.clientX - r.left, py = e.clientY - r.top;
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      if (Math.hypot((b.drawX ?? b.x) - px, b.y - py) < b.r + 8) {
        bubbles.splice(i, 1);
        sparkBurst(e.clientX, e.clientY, 7);
        softNote();
        break;
      }
    }
  });

  enterHooks.bubbles = () => {
    bubbles = [];
    const { w, h } = fitCanvas(cv);
    for (let i = 0; i < 7; i++) spawn(w, h, true);
    raf = requestAnimationFrame(loop);
  };
  leaveHooks.bubbles = () => cancelAnimationFrame(raf);
})();

/* ==========================================================
   🌬️ 숨결 별 — 4·2·6 호흡, 한 바퀴마다 별이 피어남
   ========================================================== */
(function breathPlay() {
  const circle = $("#breathCircle"), text = $("#breathText"), starsEl = $("#breathStars"), btn = $("#breathBtn");
  let running = false, timer = null;
  const PHASES = [
    { label: "들이쉬어요 ...", dur: 4000, scale: 1.35, note: 523 },
    { label: "잠깐 멈춰요", dur: 2000, scale: 1.35, note: 0 },
    { label: "천천히 내쉬어요 ~~~", dur: 6000, scale: 0.75, note: 392 },
  ];

  function runPhase(i) {
    if (!running) return;
    const p = PHASES[i];
    text.textContent = p.label;
    circle.style.transition = `transform ${p.dur}ms ease-in-out`;
    circle.style.transform = `scale(${p.scale})`;
    if (p.note) chime(p.note, p.dur / 1000, "sine", 0.06);
    timer = setTimeout(() => {
      if (i === PHASES.length - 1) {
        const star = document.createElement("span");
        star.textContent = ["🌟", "💛", "🌸", "💜", "🩵"][starsEl.children.length % 5];
        starsEl.appendChild(star);
        if (starsEl.children.length >= 8) { finish(); return; }
      }
      runPhase((i + 1) % PHASES.length);
    }, p.dur);
  }
  function finish() {
    running = false;
    text.textContent = "우와, 별 여덟 개 완성! 🌟";
    btn.textContent = "다시 하기";
    chime(659, 0.8); setTimeout(() => chime(880, 1.2), 250);
  }
  btn.addEventListener("click", () => {
    if (running) { stop(); return; }
    running = true; starsEl.innerHTML = ""; btn.textContent = "그만하기";
    runPhase(0);
  });
  function stop() {
    running = false; clearTimeout(timer);
    btn.textContent = "시작하기";
    text.textContent = "준비되면 시작을 눌러요";
    circle.style.transition = "transform 1.5s ease"; circle.style.transform = "scale(.75)";
  }
  leaveHooks.breath = stop;
})();

/* ==========================================================
   🌷 지유의 정원 — 심은 꽃이 영원히 남는 꽃밭
   ========================================================== */
(function gardenPlay() {
  const stage = $("#gardenStage"), hint = $("#gardenHint"), butterfly = $("#butterfly");
  const FLOWERS = ["🌷", "🌸", "🌼", "🌻", "🪻", "🌺", "🌹", "💐", "🍀", "🌵"];
  let flowers = store.get("garden", []);
  let bRaf = null, bt = 0;

  if (!store.get("gardenStart", null)) store.set("gardenStart", Date.now());

  function dayCount() {
    return Math.floor((Date.now() - store.get("gardenStart", Date.now())) / 86400000) + 1;
  }
  function updateHint() {
    hint.textContent = flowers.length === 0
      ? "땅을 톡 눌러서 첫 꽃을 심어 보세요 🌱"
      : `${CONFIG.childName}의 정원 ${dayCount()}일째 · 꽃 ${flowers.length}송이`;
  }
  function render() {
    stage.querySelectorAll(".flower").forEach((f) => f.remove());
    for (const f of flowers) addFlowerEl(f, false);
    updateHint();
  }
  function addFlowerEl(f, animate) {
    const el = document.createElement("div");
    el.className = "flower";
    el.textContent = f.e;
    el.style.left = f.x + "%"; el.style.top = f.y + "%";
    el.style.fontSize = f.s + "px";
    if (!animate) el.style.animation = "none";
    stage.appendChild(el);
  }

  stage.addEventListener("pointerdown", (e) => {
    const r = stage.getBoundingClientRect();
    const xPct = ((e.clientX - r.left) / r.width) * 100;
    const yPct = ((e.clientY - r.top) / r.height) * 100;
    if (yPct < 30) return; // 하늘에는 심지 않아요
    const f = { x: xPct, y: yPct, e: FLOWERS[Math.floor(Math.random() * FLOWERS.length)], s: 26 + Math.round(Math.random() * 16) };
    flowers.push(f);
    if (flowers.length > 400) flowers = flowers.slice(-400);
    store.set("garden", flowers);
    addFlowerEl(f, true);
    sparkBurst(e.clientX, e.clientY, 5);
    softNote();
    updateHint();
  });

  $("#waterBtn").addEventListener("click", () => {
    chime(587, 0.5); setTimeout(() => chime(698, 0.6), 150);
    stage.querySelectorAll(".flower").forEach((el, i) => {
      setTimeout(() => { el.classList.remove("watered"); void el.offsetWidth; el.classList.add("watered"); }, i * 40);
    });
  });

  function flyLoop() {
    bt += 0.008;
    const r = stage.getBoundingClientRect();
    const x = (Math.sin(bt * 1.3) * 0.4 + 0.5) * (r.width - 40);
    const y = (Math.sin(bt * 0.9 + 1) * 0.25 + 0.35) * r.height;
    butterfly.style.transform = `translate(${x}px, ${y}px) scaleX(${Math.cos(bt * 1.3) > 0 ? 1 : -1})`;
    bRaf = requestAnimationFrame(flyLoop);
  }

  enterHooks.garden = () => { render(); bRaf = requestAnimationFrame(flyLoop); };
  leaveHooks.garden = () => cancelAnimationFrame(bRaf);
})();

/* ==========================================================
   💌 별빛 우체통 — 하루 한 통, 날짜 따라 열리는 편지
   ========================================================== */
(function mailPlay() {
  const card = $("#letterCard");
  const L = CONFIG.letters;
  function daysSinceEpoch() { return Math.floor(Date.now() / 86400000); }
  // 설치한 날 = 첫 편지. 이후 하루에 한 통씩.
  if (store.get("mailStart", null) === null) store.set("mailStart", daysSinceEpoch());
  function unlockedCount() {
    return Math.min(L.length, daysSinceEpoch() - store.get("mailStart", daysSinceEpoch()) + 1);
  }
  let idx = 0;
  function show(i) {
    const n = unlockedCount();
    idx = Math.max(0, Math.min(i, n - 1));
    const letter = L[idx];
    card.innerHTML = `
      <div class="stamp">💌</div>
      <h3>${letter.title} <span style="font-size:12px;color:#b8a0c8">(${idx + 1} / ${L.length})</span></h3>
      <p></p>
      <div class="from">— ${CONFIG.sender}</div>`;
    card.querySelector("p").textContent = letter.body;
    card.style.animation = "none"; void card.offsetWidth; card.style.animation = "";
    $("#prevLetter").style.visibility = idx > 0 ? "visible" : "hidden";
    const next = $("#nextLetter");
    if (idx < n - 1) { next.textContent = "다음 편지 →"; next.style.opacity = 1; }
    else if (idx < L.length - 1) { next.textContent = "🔒 내일 도착해요"; next.style.opacity = 0.6; }
    else { next.textContent = "🌈 끝까지 다 읽었어요"; next.style.opacity = 0.6; }
  }
  $("#prevLetter").addEventListener("click", () => { softNote(); show(idx - 1); });
  $("#nextLetter").addEventListener("click", () => { softNote(); show(idx + 1); });
  enterHooks.mail = () => show(unlockedCount() - 1);
})();
